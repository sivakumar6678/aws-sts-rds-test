<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Ticket Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 text-center">
        <h1 class="display-4">Welcome to Ticket Booking System</h1>
        <p class="lead mt-3">Please login or register to continue</p>
        
        <div class="mt-4">
            <a th:href="@{/login}" class="btn btn-primary btn-lg me-2">Login</a>
            <a th:href="@{/register}" class="btn btn-success btn-lg">Register</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
